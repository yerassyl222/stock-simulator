<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSim — Вход</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="auth-body">

<div class="auth-container">
  <div class="auth-logo">
    <span class="logo-icon">&#9650;</span>
    <h1>StockSim</h1>
    <p>Симулятор фондового рынка</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <div class="auth-tabs">
    <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Войти</button>
    <button class="auth-tab" id="tabReg" onclick="switchTab('register')">Регистрация</button>
  </div>

  <!-- Login form -->
  <form method="POST" id="formLogin" class="auth-form">
    <input type="hidden" name="action" value="login" />
    <div class="form-group">
      <label>Имя пользователя</label>
      <input type="text" name="username" required autocomplete="username" placeholder="username" />
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" name="password" required autocomplete="current-password" placeholder="••••••" />
    </div>
    <button type="submit" class="btn-primary btn-full">Войти</button>
  </form>

  <!-- Register form -->
  <form method="POST" id="formRegister" class="auth-form hidden">
    <input type="hidden" name="action" value="register" />
    <div class="form-group">
      <label>Имя пользователя</label>
      <input type="text" name="username" required autocomplete="username" placeholder="username" />
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" name="password" required autocomplete="new-password" placeholder="••••••" />
    </div>
    <p class="auth-note">После регистрации вы получите <strong>$10,000</strong> виртуальных долларов.</p>
    <button type="submit" class="btn-primary btn-full">Зарегистрироваться</button>
  </form>
</div>

<script>
  function switchTab(tab) {
    document.getElementById('formLogin').classList.toggle('hidden', tab !== 'login');
    document.getElementById('formRegister').classList.toggle('hidden', tab !== 'register');
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabReg').classList.toggle('active', tab === 'register');
  }
</script>
</body>
</html>
